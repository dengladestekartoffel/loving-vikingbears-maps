<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mrs and Mr VikingBears Map</title>

<meta name="theme-color" content="#b8942a">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--g9:#1a1508;--g8:#3d2e0a;--g7:#8a6d1b;--g6:#b8942a;--g5:#d4af37;--g4:#e8c547;--g2:#f0e6c8;--g1:#f7f1dc;--g0:#faf7ef;--ink:#1c1a14;--mut:#6b6352;--line:#e5dcc4;--sh:0 6px 24px rgba(138,109,27,.22);--sil:#a8b0b8;--sil2:#c8d0d8;--sil3:#e8ecef}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--g0)}
#map{position:absolute;inset:0 0 0 340px;background-color:#e8e4d8;background-image:linear-gradient(rgba(184,148,42,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(184,148,42,.14) 1px,transparent 1px);background-size:64px 64px}
#side{position:absolute;top:0;left:0;bottom:0;width:340px;background:#fff;box-shadow:var(--sh);z-index:1000;display:flex;flex-direction:column;transition:transform .25s}
.head{padding:18px 18px 12px;text-align:center;border-bottom:1px solid var(--line)}
.logo{width:72px;height:72px;margin:0 auto 8px;border-radius:18px;background:linear-gradient(135deg,var(--g7),var(--g4));display:grid;place-items:center;color:#fff;font-weight:800;font-size:26px;box-shadow:0 4px 14px rgba(17,87,58,.3)}
.head h1{margin:0;font-size:1.05rem;color:var(--g8);font-weight:700}
.head small{color:var(--mut)}
.btns{display:flex;gap:8px;padding:12px 16px 4px}
button{font:inherit;cursor:pointer}
.b{flex:1;padding:8px 10px;border-radius:10px;border:1.5px solid var(--g6);background:#fff;color:var(--g7);font-weight:600;transition:.15s}
.b:hover{background:var(--g6);color:#fff}
.b.p{background:var(--g6);color:#fff}.b.p:hover{background:var(--g8)}
.sr{padding:8px 16px}
.sr input{width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--g0);font:inherit;color:var(--ink);outline:0}
.sr input:focus{border-color:var(--g5);box-shadow:0 0 0 3px rgba(34,160,107,.2)}
.prog{padding:2px 16px 8px;font-size:.8rem;color:var(--mut)}
.bar{height:6px;border-radius:9px;background:var(--g1);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;width:0;background:var(--g5);transition:width .3s}
#cats{flex:1;overflow:auto;padding:0 12px 12px}
.gh{margin:12px 0 6px;padding:7px 12px;background:var(--g1);color:var(--g8);border-left:4px solid var(--g6);border-radius:8px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;font-size:.76rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.ci{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:8px;cursor:pointer;user-select:none;position:relative;min-width:0;opacity:.45;transition:.12s}
.ci.on{opacity:1;background:var(--g0);font-weight:600}
.ci:hover{background:var(--g1)}
.ci .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.86rem}
.ci .n{color:var(--g7);font-weight:700;font-size:.78rem}
.ci .add{display:none;border:0;background:var(--g6);color:#fff;border-radius:6px;width:20px;height:20px;line-height:18px;padding:0;font-weight:700}
.ci:hover .add{display:block}.ci:hover .n{display:none}
.ci.placing{outline:2px solid var(--g5)}
.ic{flex:none;width:20px;height:26px;background-repeat:no-repeat}
.foot{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px}
.foot .b{font-size:.8rem;padding:6px}
.pin{width:33px;height:44px;background-repeat:no-repeat;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.pin.found{opacity:.4;filter:grayscale(1)}
.leaflet-container{font-family:inherit}
.leaflet-popup-content-wrapper{border-radius:14px;border-top:4px solid var(--g6);box-shadow:var(--sh);color:var(--ink)}
.leaflet-popup-content{margin:12px 14px;min-width:190px}
.pp h3{margin:0 0 2px;color:var(--g8);font-size:1rem}
.pp .c{color:var(--mut);font-size:.8rem;margin-bottom:8px}
.pp input[type=text]{width:100%;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;font:inherit;margin-bottom:8px}
.pp label{display:flex;gap:6px;align-items:center;font-size:.88rem;margin-bottom:8px}
.pp .row{display:flex;gap:6px}.pp .b{padding:5px 8px;font-size:.8rem}
.pp .inf{font-size:.8rem;color:var(--mut);margin-bottom:8px}
.leaflet-bar{border:0!important;box-shadow:var(--sh)!important;border-radius:12px!important;overflow:hidden}
.leaflet-bar a{color:var(--g7)!important;border-color:var(--line)!important}.leaflet-bar a:hover{background:var(--g1)!important}

#banner{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:1100;background:var(--g7);color:#fff;border-radius:12px;padding:8px 14px;box-shadow:var(--sh);display:none;font-size:.88rem;white-space:nowrap}
#banner button{margin-left:10px;background:#fff;color:var(--g7);border:0;border-radius:8px;padding:3px 10px;font-weight:700}
#toast{position:absolute;bottom:50px;left:50%;transform:translateX(-50%);z-index:1100;background:#fff;color:var(--ink);border-left:4px solid var(--g6);border-radius:10px;padding:10px 14px;box-shadow:var(--sh);display:none;max-width:90%;font-size:.85rem}

#scrim{display:none;position:fixed;inset:0;background:rgba(26,21,8,.45);z-index:950}

/* Access gate */
#gate{position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#1a1508 0%,#3d2e0a 40%,#8a6d1b 100%);display:flex;align-items:center;justify-content:center;padding:24px;padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}
#gate.ok{display:none}
.gate-box{background:#fff;border-radius:18px;padding:28px 26px;width:100%;max-width:360px;box-shadow:0 12px 40px rgba(0,0,0,.35);text-align:center}
.gate-box .logo{margin:0 auto 14px}
.gate-box h2{margin:0 0 6px;font-size:1.15rem;color:var(--g8)}

.gate-box label{display:block;text-align:left;font-size:.75rem;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.gate-box input{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;margin-bottom:12px;background:var(--g0);font-size:16px}
.gate-box input:focus{border-color:var(--g5);outline:0;box-shadow:0 0 0 3px rgba(184,148,42,.25)}
.gate-box .b{width:100%;padding:12px;margin-top:4px;font-size:1rem;min-height:44px}
.gate-err{color:#b33;font-size:.85rem;min-height:1.2em;margin:8px 0 0;display:none}
.gate-err.show{display:block}
.gate-status{font-size:.8rem;color:var(--mut);margin-top:10px;min-height:1.2em}
#app{display:none;position:relative;height:100%;width:100%}
#app.open{display:block}

/* Mobile */
@media(max-width:768px){
  #map{left:0;right:0;bottom:0;top:0}
  #side{transform:translateX(-100%);width:min(92vw,340px);max-width:100%;z-index:1100;padding-bottom:env(safe-area-inset-bottom)}
  #side.open{transform:none}
  #tog{display:flex;align-items:center;justify-content:center;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left))}
  #coords{left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));font-size:.7rem;padding:4px 8px}
  .leaflet-top.leaflet-left{margin-left:56px;margin-top:max(8px,env(safe-area-inset-top))}
  .leaflet-top.leaflet-right{margin-top:max(8px,env(safe-area-inset-top));margin-right:max(8px,env(safe-area-inset-right))}
  #banner{left:12px;right:12px;transform:none;width:auto;max-width:none;white-space:normal;text-align:center;font-size:.82rem;top:max(12px,env(safe-area-inset-top));padding:10px 12px}
  #banner button{display:inline-block;margin:6px 0 0;margin-left:0}
  #toast{bottom:max(60px,env(safe-area-inset-bottom));left:12px;right:12px;transform:none;max-width:none}
  .ci{padding:8px 8px;min-height:40px}
  .ci .add{display:flex;align-items:center;justify-content:center;width:28px;height:28px;font-size:1.1rem}
  .ci .n{display:none}
  .ci.on .n{display:none}
  .head{padding:14px 14px 10px}
  .logo{width:56px;height:56px;font-size:22px;border-radius:14px}
  .head h1{font-size:.95rem}
  .btns{padding:10px 12px 4px}
  .b{padding:10px;min-height:40px}
  .sr{padding:8px 12px}
  .sr input{font-size:16px;padding:10px 12px}
  .prog{padding:2px 12px 8px;font-size:.75rem}
  #cats{padding:0 8px 12px;-webkit-overflow-scrolling:touch}
  .foot{padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
  .leaflet-popup-content{margin:10px 12px;min-width:160px;max-width:min(280px,85vw)}
  .pp .b{padding:8px 10px;min-height:36px}
  .pp input[type=text]{font-size:16px;padding:8px}
  .pp label{font-size:.95rem;padding:4px 0}
  #scrim.show{display:block}
  #side.open~#scrim,body.side-open #scrim{display:block}
}
@media(max-width:380px){
  .grid{grid-template-columns:1fr}
  #side{width:100%}
  .gate-box{padding:22px 18px}
}

function clonePins(arr){try{return JSON.parse(JSON.stringify(arr||[]))}catch(e){return (arr||[]).slice()}}
function loadPins(){
  try{
    const s=localStorage.getItem(KEY);
    if(s){const j=JSON.parse(s);if(Array.isArray(j)&&j.length)return j}
  }catch(e){}
  return clonePins(DEFAULT_PINS);
}
function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify(pins));
    localStorage.setItem(VKEY,JSON.stringify(vis));
  }catch(e){console&&console.warn&&console.warn('save failed',e)}
}
function toast(m,ms=4000){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',ms)}

function startApp(){
/* initial load — pins gemmes i localStorage */
try{
  pins=loadPins();
  try{vis=JSON.parse(localStorage.getItem(VKEY)||'{}')}catch(e){vis={}}
}catch(e){pins=clonePins(DEFAULT_PINS);vis={}}
Object.keys(cats).forEach(id=>{if(!(id in vis))vis[id]=true});

/* map */
const map=L.map('map',{center:[D.lat,D.lng],zoom:D.zoom,minZoom:D.minZoom,maxZoom:D.maxZoom,zoomControl:false,attributionControl:true});
window._map=map;
L.control.zoom({position:'topright'}).addTo(map);
setTimeout(()=>map.invalidateSize(),100);
let errs=0;
const tl=L.tileLayer(D.tile,{minZoom:D.minZoom,maxZoom:D.maxZoom,maxNativeZoom:D.nativeMax,tileSize:256,attribution:'Mrs and Mr VikingBears Map · tiles © MapGenie'}).addTo(map);
tl.on('tileerror',e=>{if(++errs===3){toast('Kortfliserne kan ikke hentes. Åbn filen direkte i din browser med internet. Hvis det stadig fejler, blokerer MapGenies server eksterne sider. Fliser-URL: '+(e.tile&&e.tile.src||''),20000)}});
tl.on('tileload',()=>{errs=-1e9;$('#toast').style.display='none'});
window.addEventListener('load',()=>setTimeout(()=>{if(location.protocol==='file:'||true){}},0));
map.on('mousemove',e=>$('#coords').textContent=e.latlng.lat.toFixed(5)+', '+e.latlng.lng.toFixed(5));

/* icons */
function spriteStyle(id,scale){const p=D.spr[id];if(!p)return'';const k=scale/2;return `background-image:url(${SPR_URL});background-size:${SW*k}px ${SH*k}px;background-position:-${p.x*k}px -${p.y*k}px`}
function mkIcon(p){return L.divIcon({className:'',iconSize:[33,44],iconAnchor:[16,44],popupAnchor:[0,-40],html:`<div class="pin ${p.found?'found':''}" style="${spriteStyle(p.cat,1)}"></div>`})}

/* markers */
const layer=L.layerGroup().addTo(map);const mk={};
function render(){
  layer.clearLayers();
  pins.forEach(p=>{
    if(!vis[p.cat])return;
    const m=L.marker([p.lat,p.lng],{icon:mkIcon(p),title:p.name||cats[p.cat].title}).addTo(layer);
    m.bindPopup(()=>popup(p));
  });
  counts();
}
window._render=render;
function popup(p){
  const c=cats[p.cat],d=document.createElement('div');d.className='pp';
  d.innerHTML=`<h3></h3><div class="c"></div>${c.info?'<div class="inf"></div>':''}<input type="text" placeholder="Name / note"><label><input type="checkbox"> Found</label><div class="row"><button class="b del">Delete</button><button class="b cp">Copy coords</button></div>`;
  d.querySelector('h3').textContent=p.name||c.title;
  d.querySelector('.c').textContent=c.title+' · '+p.lat.toFixed(5)+', '+p.lng.toFixed(5);
  if(c.info)d.querySelector('.inf').textContent=c.info;
  const inp=d.querySelector('input[type=text]');inp.value=p.name||'';
  inp.onchange=()=>{p.name=inp.value.trim();d.querySelector('h3').textContent=p.name||c.title;save()};
  const cb=d.querySelector('input[type=checkbox]');cb.checked=!!p.found;
  cb.onchange=()=>{p.found=cb.checked;save();map.closePopup();render()};
  d.querySelector('.del').onclick=()=>{pins=pins.filter(x=>x!==p);save();map.closePopup();render()};
  d.querySelector('.cp').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(p.lat+', '+p.lng);toast('Coordinates copied')};
  return d;
}

/* sidebar */
function buildCats(filter=''){
  const f=filter.toLowerCase(),root=$('#cats');root.innerHTML='';
  D.groups.forEach(g=>{
    const list=g.categories.filter(c=>c.title.toLowerCase().includes(f));
    if(!list.length)return;
    const h=document.createElement('div');h.className='gh';h.textContent=g.title;root.appendChild(h);
    const gr=document.createElement('div');gr.className='grid';
    list.forEach(c=>{
      const e=document.createElement('div');e.className='ci'+(vis[c.id]?' on':'')+(placing==c.id?' placing':'');e.dataset.id=c.id;
      e.innerHTML=`<span class="ic" style="${spriteStyle(c.id,0.6)}"></span><span class="t"></span><span class="n"></span><button class="add" title="Place pin on map">+</button>`;
      e.querySelector('.t').textContent=c.title;e.title=c.title;
      e.onclick=ev=>{if(ev.target.classList.contains('add'))return;vis[c.id]=!vis[c.id];save();e.classList.toggle('on',vis[c.id]);render()};
      e.querySelector('.add').onclick=()=>startPlace(c.id);
      gr.appendChild(e);
    });
    root.appendChild(gr);
  });
  counts();
}
window._buildCats=buildCats;
function counts(){
  const per={};pins.forEach(p=>per[p.cat]=(per[p.cat]||0)+1);
  document.querySelectorAll('.ci').forEach(e=>{const c=cats[e.dataset.id];e.querySelector('.n').textContent=(per[c.id]||0)+'/'+c.count});
  const total=Object.values(cats).reduce((a,c)=>a+c.count,0),found=pins.filter(p=>p.found).length;
  $('#progTxt').textContent=`${found} found · ${pins.length} pins placed · ${total} total in game`;
  $('#progBar').style.width=Math.min(100,found/total*100)+'%';
}
$('#q').oninput=e=>buildCats(e.target.value);
$('#showAll').onclick=()=>{Object.keys(vis).forEach(k=>vis[k]=true);save();buildCats($('#q').value);render()};
$('#hideAll').onclick=()=>{Object.keys(vis).forEach(k=>vis[k]=false);save();buildCats($('#q').value);render()};

/* place pins */
function startPlace(id){placing=id;vis[id]=true;const b=$('#banner');b.innerHTML=`Click the map to place: <b>${cats[id].title}</b><button id="stop">Done</button>`;b.style.display='block';$('#stop').onclick=stopPlace;map.getContainer().style.cursor='crosshair';buildCats($('#q').value);render();if(innerWidth<=768)setSideOpen(false)}
function stopPlace(){placing=null;$('#banner').style.display='none';map.getContainer().style.cursor='';buildCats($('#q').value)}
map.on('click',e=>{if(!placing)return;pins.push({id:Date.now()+Math.random(),cat:placing,lat:e.latlng.lat,lng:e.latlng.lng,name:'',found:false});save();render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')stopPlace()});

/* export / import */
$('#exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(pins,null,1)],{type:'application/json'}));a.download='big-walk-pins.json';a.click()};
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{try{let j=JSON.parse(await e.target.files[0].text());
  if(!Array.isArray(j))j=j.locations||(j.data&&j.data.locations)||(j.map&&j.map.locations)||[];
  let n=0;j.forEach(p=>{const cat=+(p.cat??p.category_id),lat=parseFloat(p.lat??p.latitude),lng=parseFloat(p.lng??p.longitude);
    if(cats[cat]&&isFinite(lat)&&isFinite(lng)){pins.push({id:Date.now()+Math.random(),cat,lat,lng,name:p.name||p.title||'',found:!!p.found});n++}});
  save();render();toast(n?n+' pins imported':'Ingen pins fundet i filen',5000)}catch(err){toast('Ugyldig JSON-fil')}e.target.value=''};
$('#clr').onclick=()=>{if(pins.length&&confirm('Delete all placed pins?')){pins=[];save();render()}};
function setSideOpen(on){
  $('#side').classList.toggle('open',!!on);
  document.body.classList.toggle('side-open',!!on);
  const sc=$('#scrim');if(sc)sc.classList.toggle('show',!!on);
}
$('#tog').onclick=()=>setSideOpen(!$('#side').classList.contains('open'));
$('#scrim').onclick=()=>setSideOpen(false);
window.addEventListener('resize',()=>{
  if(window._map)setTimeout(()=>window._map.invalidateSize(),100);
  if(innerWidth>768)setSideOpen(false);
});

buildCats();render();
if(!pins.length)toast('Vælg en kategori og tryk "+" for at placere pins på kortet.',7000);
else toast(pins.length+' pins indlæst.',4000);
} /* end startApp */
</script>
</body>
</html>
